  - standard: RS-CAPABILITY
    applicability: APPLICABLE
    evidenceStatus: CONFIRMED
    rationale: It owns reusable capability semantics, capability registry and producer/consumer policy for the portfolio.

maturity:
  recommendedLevel: R2
  rationale: >-
    Powerful Brain is strongly discoverable and substantially machine-readable, with versioned YAML registries,
    explicit governance semantics and CR-1 JSON Schemas. It does not yet have deterministic repository-wide
    validation, fixtures/compatibility enforcement or CI, and master is unprotected; therefore R3 VALIDATED
    is not yet evidenced.
  perStandard:
    RS-CORE: R2
    RS-GOV: R2
    RS-CONTRACT: R2
    RS-CAPABILITY: R2

