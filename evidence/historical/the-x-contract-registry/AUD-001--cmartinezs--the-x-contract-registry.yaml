standardFeedback:
  - type: STANDARD_CANDIDATE
    id: STDCAND-AUD001-001
    sourcePattern: >-
      Machine-readable cross-file registries with canonical IDs and relationships require
      deterministic schema plus referential-integrity validation before R3 can be claimed.
    proposedStandard: >-
      Clarify RS-CONTRACT so R3 requires schema validation, vocabulary validation,
      duplicate-ID detection, and typed referential-integrity checks for registry-style contracts.
    evidenceStatus: EVIDENCED

  - type: STANDARD_CANDIDATE
    id: STDCAND-AUD001-002
    sourcePattern: >-
      Audit evidence needs per-claim epistemic state so confirmed metadata, repository evidence,
      inference, provisional reconciliation, and unknowns are not flattened into one confidence score.
    proposedStandard: >-
      Add evidenceStatus vocabulary CONFIRMED/EVIDENCED/INFERRED/PROVISIONAL/UNKNOWN to the audit record model.
    evidenceStatus: EVIDENCED

  - type: REQUIREMENT_CLARIFICATION
    id: STDFEEDBACK-AUD001-003
    sourcePattern: RS-SERVICE and RS-API are used inconsistently as identifiers/labels.
    proposedStandard: >-
      Declare RS-SERVICE as canonical and RS-API as an alias only if the distinction is intentionally unnecessary; otherwise split them explicitly.
    evidenceStatus: EVIDENCED

  - type: MISSING_MACHINE_READABLE_FIELD
    id: STDFEEDBACK-AUD001-004
    sourcePattern: Current audit template cannot encode conformance result per requirement.
    proposedStandard: >-
      Add conformance.standard.requirement.result with PASS/PARTIAL/FAIL/NOT_APPLICABLE/UNKNOWN.
    evidenceStatus: CONFIRMED

  - type: MISSING_MACHINE_READABLE_FIELD
    id: STDFEEDBACK-AUD001-005
    sourcePattern: Current audit template lacks final reference-readiness decision.
    proposedStandard: Add readinessDecision with YES/YES_WITH_CONDITIONS/NO plus explicit conditions.
    evidenceStatus: CONFIRMED

recommendedActions:
  - priority: P0_NOW
    action: Approve an audit schema/template v0.2 model that can faithfully represent applicability, requirement-level conformance, evidence status, snapshot, and readiness decision.
    rationale: The first dogfood audit had to extend the template to avoid losing required information.
  - priority: P0_NOW
    action: Define and implement deterministic registry/audit validation with schemas and referential-integrity checks.
    rationale: This is the minimum control needed before treating machine-readable registry state as validated.
  - priority: P0_NOW
    action: Normalize RS-SERVICE/RS-API and relationship endpoint vocabularies.
