    evidenceStatus: CONFIRMED
    rationale: Repository participates in The X ecosystem and owns cross-repository control metadata.
  - standard: RS-GOV
    applicability: APPLICABLE
    evidenceStatus: CONFIRMED
    rationale: Repository owns repository standards, audit policy/program metadata, and governance classifications.
  - standard: RS-CONTRACT
    applicability: APPLICABLE
    evidenceStatus: CONFIRMED
    rationale: YAML registries are explicitly intended for machine consumption by humans, agents, UIs, and services.
  - standard: RS-DATA
    applicability: NOT_APPLICABLE
    evidenceStatus: EVIDENCED
    rationale: The repository owns governance/contract registry artifacts, not a persistence subsystem or operational data store distinct from those contracts.
  - standard: RS-TOOLING
    applicability: NOT_APPLICABLE
    evidenceStatus: EVIDENCED
    rationale: It currently defines policy/registry artifacts but does not implement a CLI/plugin/automation runtime that operates repositories.
  - standard: RS-CAPABILITY
    applicability: NOT_APPLICABLE
    evidenceStatus: EVIDENCED
    rationale: The repository registers shared capabilities/authorities but is not itself a reusable execution capability implementation.
  - standard: RS-PUBLIC
    applicability: NOT_APPLICABLE
    evidenceStatus: CONFIRMED
    rationale: GitHub metadata reports PRIVATE visibility.
  - standard: RS-LEGACY
    applicability: NOT_APPLICABLE
    evidenceStatus: CONFIRMED
    rationale: Repository is active and not superseded/deprecated/archived.

maturity:
  recommendedLevel: R2
  rationale: >-
    The repository is clearly discoverable and exposes substantial machine-readable YAML
    for repositories, standards, relationships, contracts, and audits. It does not yet
    provide deterministic schema/referential-integrity validation or CI enforcement, so
    R3 VALIDATED is not evidenced.
  perStandard:
    RS-CORE: R2
    RS-GOV: R2
    RS-CONTRACT: R2

